<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektroniczna Karta Drogowa v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md p-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold">🚛 Karta Drogowa <span class="text-[10px] bg-blue-800 px-1.5 py-0.5 rounded">v6</span></h1>
            <span id="userBadge" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full hidden">Niezałogowany</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col">
        <!-- KROK 1: Wybór użytkownika i PIN -->
        <div id="loginSection" class="bg-white rounded-xl shadow-sm p-5 space-y-4">
            <h2 class="text-base font-bold text-slate-700">Wybierz kierowcę</h2>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Imię i nazwisko</label>
                <select id="driverSelect" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
                    <option value="">-- Ładowanie listy... --</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Kod PIN / Hasło</label>
                <input type="password" id="pinInput" placeholder="Wpisz swoje hasło" class="w-full p-2.5 border rounded-lg text-sm">
            </div>
            <button onclick="login()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">Zaloguj się</button>
        </div>

        <!-- KROK 2: Panel Główny -->
        <div id="dashboardSection" class="hidden space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-4 border-l-4" id="statusCardBorder">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-xs text-slate-400">Aktualny status</p>
                        <h3 id="currentStatusText" class="font-bold text-base text-slate-700">Ładowanie...</h3>
                    </div>
                    <span id="statusIndicatorBadge" class="text-xs px-2.5 py-1 rounded-full font-medium">--</span>
                </div>
                <div class="mt-2 pt-2 border-t text-xs text-slate-500 flex justify-between">
                    <span>Pojazd: <strong id="assignedVehicle" class="text-slate-700">-</strong></span>
                    <button onclick="logout()" class="text-red-500 hover:underline">Wyloguj</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="startRouteBtn" onclick="openStartModal()" class="bg-emerald-600 text-white p-4 rounded-xl shadow-sm font-semibold text-sm flex flex-col items-center justify-center gap-1 hover:bg-emerald-700 transition hidden">🟢 Rozpocznij Trasę</button>
                <button id="endRouteBtn" onclick="openEndModal()" class="bg-rose-600 text-white p-4 rounded-xl shadow-sm font-semibold text-sm flex flex-col items-center justify-center gap-1 hover:bg-rose-700 transition hidden">🔴 Zakończ Trasę</button>
                <button onclick="openFuelModal()" class="bg-amber-500 text-white p-4 rounded-xl shadow-sm font-semibold text-sm flex flex-col items-center justify-center gap-1 hover:bg-amber-600 transition col-span-2">⛽ Zgłoś Tankowanie</button>
            </div>
        </div>
    </main>

    <script>
        // Automatyczny adres API (bazuje na adresie wdrożenia Google)
        const API_URL = window.location.href.split('?')[0];
        let currentUser = null;

        window.onload = function() {
            fetchDrivers();
        };

        async function fetchDrivers() {
            try {
                const res = await fetch(API_URL + "?action=getDrivers");
                const data = await res.json();
                if (data.status === "success") {
                    const select = document.getElementById("driverSelect");
                    select.innerHTML = '<option value="">-- Wybierz swoje imię i nazwisko --</option>';
                    data.drivers.forEach(d => {
                        select.innerHTML += `<option value="${d.name}" data-vehicle="${d.plate}">${d.name} (${d.plate || 'Brak pojazdu'})</option>`;
                    });
                } else {
                    alert("Błąd serwera: " + data.message);
                }
            } catch (e) {
                console.error(e);
                alert("Nie udało się pobrać listy kierowców.");
            }
        }

        async function login() {
            const select = document.getElementById("driverSelect");
            const name = select.value;
            const pin = document.getElementById("pinInput").value;
            if (!name) return alert("Wybierz kierowcę!");

            try {
                const res = await fetch(API_URL + `?action=login&name=${encodeURIComponent(name)}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();
                
                if (data.status === "success") {
                    const selectedOpt = select.options[select.selectedIndex];
                    currentUser = {
                        name: name,
                        vehicle: selectedOpt.getAttribute("data-vehicle"),
                        status: data.driverStatus
                    };
                    updateDashboard();
                } else {
                    alert(data.message || "Błędne hasło / PIN!");
                }
            } catch (err) {
                alert("Błąd logowania: " + err.message);
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById("loginSection").classList.remove("hidden");
            document.getElementById("dashboardSection").classList.add("hidden");
            document.getElementById("userBadge").classList.add("hidden");
            document.getElementById("pinInput").value = "";
        }

        function updateDashboard() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            const badge = document.getElementById("userBadge");
            badge.innerText = currentUser.name;
            badge.classList.remove("hidden");

            document.getElementById("assignedVehicle").innerText = currentUser.vehicle || "Brak";
            const statusText = document.getElementById("currentStatusText");
            const indicator = document.getElementById("statusIndicatorBadge");
            const cardBorder = document.getElementById("statusCardBorder");

            const startBtn = document.getElementById("startRouteBtn");
            const endBtn = document.getElementById("endRouteBtn");

            if (currentUser.status === "W trasie") {
                statusText.innerText = "Jesteś w trakcie trasy";
                indicator.innerText = "W TRASIE";
                indicator.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-rose-100 text-rose-700";
                cardBorder.className = "bg-white rounded-xl shadow-sm p-4 border-l-4 border-rose-500";
                startBtn.classList.add("hidden");
                endBtn.classList.remove("hidden");
            } else {
                statusText.innerText = "Status: Wolny (Gotowy do trasy)";
                indicator.innerText = "WOLNY";
                indicator.className = "text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-100 text-emerald-700";
                cardBorder.className = "bg-white rounded-xl shadow-sm p-4 border-l-4 border-emerald-500";
                startBtn.classList.remove("hidden");
                endBtn.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
